# Checks that need no OCI credentials. They run on the template repository too.
# terraform.yml plans and applies.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive terraform
      # init downloads the modules at the pinned tag, without a backend
      - name: Validate each stack
        run: |
          for dir in $(find terraform -name '*.tf' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fluxcd/flux2/action@v2.9.6
        with:
          version: 2.9.6
      # Flux replaces ${name} with the values of cluster-vars.yaml, as in the
      # cluster. --strict fails on a name that cluster-vars.yaml does not have.
      - name: Build gitops/clusters/oci
        run: |
          eval "$(yq '.data | to_entries | .[] | "export " + .key + "=" + (.value | @sh)' gitops/clusters/oci/cluster-vars.yaml)"
          kubectl kustomize gitops/clusters/oci | flux envsubst --strict > /dev/null
          kubectl kustomize gitops/apps > /dev/null
          yq . gitops/clusters/oci/platform-account-b.yaml > /dev/null

  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Renovate 44 needs Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes --package renovate@44.145.1 renovate-config-validator

  # The gitleaks CLI, not the gitleaks action: the action needs a license for
  # a repository that an organization owns.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck .github/scripts/*.sh
      - run: .github/scripts/test-changed-stacks.sh
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
